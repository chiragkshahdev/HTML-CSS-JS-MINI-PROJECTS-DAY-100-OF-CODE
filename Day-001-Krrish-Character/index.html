<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krrish 3 - Plane Rescue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="message" id="message">AEROPLANE IN DANGER OVER CITY!</div>
  
  <div class="city" id="city"></div>
  
  <div class="plane" id="plane">✈️</div>

  <div class="krrish-scene" id="krrish">
    <div class="cape"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="body"><div class="logo"></div></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    <div class="head"><div class="mask"></div></div>
  </div>

  <button class="btn" id="btn">RESCUE PLANE</button>

  <script src="script.js"></script>
</body>
</html>
