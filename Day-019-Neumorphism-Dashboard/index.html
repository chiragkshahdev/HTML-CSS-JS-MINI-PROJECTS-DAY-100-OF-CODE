<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19 - Neumorphism</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="neumo-btn small"><i class='bx bx-arrow-back'></i></div>
            <span>PLAYING NOW</span>
            <div class="neumo-btn small" id="themeToggle"><i class='bx bx-moon'></i></div>
        </div>

        <div class="cover-art">
            <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500" alt="cover">
        </div>

        <h2>Blinding Lights</h2>
        <p class="artist">The Weeknd</p>

        <div class="progress-area">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="timer">
                <span>1:24</span>
                <span>3:20</span>
            </div>
        </div>

        <div class="controls">
            <div class="neumo-btn"><i class='bx bx-skip-previous'></i></div>
            <div class="neumo-btn play-btn"><i class='bx bx-play'></i></div>
            <div class="neumo-btn"><i class='bx bx-skip-next'></i></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
