<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">HTML CSS JS Game</p>

        <div class="status">
            <p id="status-text">Player <span>X</span>'s Turn</p>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="scoreboard">
            <div class="score"><b id="score-x">0</b><span>Player X</span></div>
            <div class="score"><b id="score-draw">0</b><span>Draw</span></div>
            <div class="score"><b id="score-o">0</b><span>Player O</span></div>
        </div>

        <button id="reset">Restart Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
