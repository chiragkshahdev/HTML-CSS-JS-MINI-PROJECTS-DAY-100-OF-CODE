<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 28 - Memory Flip Card Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🧠 Memory Flip - Day 28</h1>
    <div class="stats">
      <span>Moves: <b id="moves">0</b></span>
      <span>Time: <b id="timer">00:00</b></span>
      <span>Matched: <b id="matched">0/8</b></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="controls">
      <button id="restart">🔄 Restart</button>
      <button id="hint">💡 Hint (3)</button>
    </div>
    <div id="winModal" class="modal hidden">
      <div class="modal-content">
        <h2>🎉 You Won!</h2>
        <p id="winStats"></p>
        <button id="playAgain">Play Again</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
