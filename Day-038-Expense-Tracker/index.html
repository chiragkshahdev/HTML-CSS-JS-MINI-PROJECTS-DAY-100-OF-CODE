<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 38 - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 Expense Tracker</h1>
    
    <div class="balance-box">
      <h4>Your Balance</h4>
      <h2 id="balance">₹0.00</h2>
      <div class="income-expense">
        <div class="money income">
          <h4>Income</h4>
          <p id="income">+₹0.00</p>
        </div>
        <div class="money expense">
          <h4>Expense</h4>
          <p id="expense">-₹0.00</p>
        </div>
      </div>
    </div>

    <h3>History</h3>
    <ul id="list" class="list"></ul>

    <h3>Add Transaction</h3>
    <form id="form">
      <input type="text" id="text" placeholder="Enter text (e.g. Salary, Food)">
      <input type="number" id="amount" placeholder="Enter amount, - for expense">
      <button class="btn">Add Transaction</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
