<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 39 - BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>BMI Calculator</h1>
    
    <div class="input-group">
      <label>Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 175">
    </div>
    
    <div class="input-group">
      <label>Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 70">
    </div>

    <button id="calcBtn">Calculate BMI</button>
    
    <div class="result" id="result">
      <h2 id="bmiValue">--</h2>
      <p id="bmiStatus">Enter your details</p>
    </div>

    <div class="chart">
      <div><span style="background:#74b9ff"></span> Underweight &lt; 18.5</div>
      <div><span style="background:#00b894"></span> Normal 18.5 - 24.9</div>
      <div><span style="background:#fdcb6e"></span> Overweight 25 - 29.9</div>
      <div><span style="background:#d63031"></span> Obese 30+</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
