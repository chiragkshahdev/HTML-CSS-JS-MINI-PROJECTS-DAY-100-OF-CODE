<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 44 - Dictionary App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📚 Dictionary</h1>
    <div class="search">
      <input type="text" id="wordInput" placeholder="Enter word e.g. hello">
      <button id="searchBtn">Search</button>
    </div>
    <div class="result" id="result">
      <p>Type a word and search</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
