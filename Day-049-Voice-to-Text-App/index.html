<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice to Text - Day 49</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎤 Voice to Text</h1>
      <p>Day 49 - Speak and Convert</p>
    </header>

    <div class="controls-top">
      <select id="language">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="hi-IN">Hindi</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="ja-JP">Japanese</option>
        <option value="ar-SA">Arabic</option>
      </select>
      <div class="status" id="status"><span class="dot"></span> Idle</div>
    </div>

    <div class="mic-box">
      <button id="micBtn" class="mic">
        <i class="fas fa-microphone"></i>
      </button>
      <p class="hint">Tap to start speaking</p>
      <div class="waves hidden" id="waves">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="text-area">
      <div class="text-header">
        <span>Transcript</span>
        <div>
          <span id="wordCount">0 words</span>
          <span id="charCount">0 chars</span>
        </div>
      </div>
      <textarea id="output" placeholder="Your speech will appear here..."></textarea>
      <p id="interim" class="interim"></p>
    </div>

    <div class="actions">
      <button id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
      <button id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
      <button id="downloadBtn"><i class="fas fa-download"></i> Download</button>
      <button id="speakBtn"><i class="fas fa-volume-up"></i> Speak Text</button>
    </div>

    <div class="history">
      <h3>History</h3>
      <div id="historyList"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
