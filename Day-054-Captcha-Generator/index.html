<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 54 - Captcha Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Captcha Generator</h2>
        <div class="captcha-box">
            <div class="captcha" id="captchaText"></div>
            <button id="refreshBtn">↻</button>
        </div>
        <input type="text" id="input" placeholder="Enter captcha">
        <p id="message"></p>
        <button id="checkBtn">Verify</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
