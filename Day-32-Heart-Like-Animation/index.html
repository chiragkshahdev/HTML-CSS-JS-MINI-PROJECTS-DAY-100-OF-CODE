<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Like Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <img src="https://picsum.photos/400/500" alt="post">
      <div class="heart-icon" id="bigHeart">❤️</div>
      <div class="like-count">Double Tap to Like</div>
    </div>
    <div class="actions">
      <span id="likeBtn">🤍</span>
      <span id="count">0 Likes</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
