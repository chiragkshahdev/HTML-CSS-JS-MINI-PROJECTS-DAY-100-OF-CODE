<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 40 - Age Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎂 Age Calculator</h1>
    <p>Enter your Date of Birth</p>
    
    <input type="date" id="dob">
    <button id="calcBtn">Calculate Age</button>

    <div class="result" id="result">
      <div class="box">
        <h2 id="years">--</h2>
        <span>Years</span>
      </div>
      <div class="box">
        <h2 id="months">--</h2>
        <span>Months</span>
      </div>
      <div class="box">
        <h2 id="days">--</h2>
        <span>Days</span>
      </div>
    </div>
    
    <p id="fullAge" class="full"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
