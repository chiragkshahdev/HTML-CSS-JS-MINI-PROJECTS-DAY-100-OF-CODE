<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board - Day 46</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📋 Kanban Board</h1>
      <p>Day 46 - Drag & Drop</p>
      <button id="addColumnBtn">+ Add Column</button>
    </header>

    <div class="board" id="board">
      <div class="column" data-status="todo">
        <div class="col-header">
          <span class="dot todo"></span>
          <h3>To Do</h3>
          <span class="count">0</span>
        </div>
        <div class="tasks" id="todo"></div>
        <button class="add-task" data-target="todo">+ Add Task</button>
      </div>

      <div class="column" data-status="progress">
        <div class="col-header">
          <span class="dot progress"></span>
          <h3>In Progress</h3>
          <span class="count">0</span>
        </div>
        <div class="tasks" id="progress"></div>
        <button class="add-task" data-target="progress">+ Add Task</button>
      </div>

      <div class="column" data-status="done">
        <div class="col-header">
          <span class="dot done"></span>
          <h3>Done</h3>
          <span class="count">0</span>
        </div>
        <div class="tasks" id="done"></div>
        <button class="add-task" data-target="done">+ Add Task</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Task</h3>
      <input type="text" id="taskTitle" placeholder="Task title...">
      <textarea id="taskDesc" placeholder="Description (optional)"></textarea>
      <div class="modal-actions">
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
