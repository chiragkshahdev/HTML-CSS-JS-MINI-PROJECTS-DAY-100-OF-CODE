<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 55 - Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <div class="box">
            <label>Amount</label>
            <input type="number" id="amount" value="1">
        </div>
        <div class="dropdown">
            <div class="box">
                <label>From</label>
                <select id="from"></select>
            </div>
            <div class="icon">⇄</div>
            <div class="box">
                <label>To</label>
                <select id="to"></select>
            </div>
        </div>
        <p id="result">1 USD = 83.50 INR</p>
        <button id="btn">Convert</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
