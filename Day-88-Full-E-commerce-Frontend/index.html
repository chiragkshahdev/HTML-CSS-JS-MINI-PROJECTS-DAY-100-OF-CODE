<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 88 - ShopKart | Full E-commerce Frontend</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Shop<span>Kart</span></h1>
    <input type="text" id="searchInput" placeholder="Search products...">
    <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="mobile">Mobile</button>
    <button class="filter-btn" data-category="laptop">Laptop</button>
    <button class="filter-btn" data-category="watch">Watch</button>
    <button class="filter-btn" data-category="shoes">Shoes</button>
    <select id="sortSelect">
      <option value="default">Sort By</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <main id="productGrid"></main>

  <!-- Cart Sidebar -->
  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="closeCart">X</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <button id="checkoutBtn">Checkout</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
